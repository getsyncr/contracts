---
# The CI that the CIHub merge queue waits for (test repository). It runs on
# every pull request, the draft PRs of the queue included, and reports one
# check named `ci`. The check fails when the tested commit holds a file
# `FAIL` at the root: a PR adds it to play a red CI.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tested commit
        run: |
          if [ -f FAIL ]; then
            echo "FAIL is present: this commit asks for a red CI"
            exit 1
          fi
          echo "ok"
